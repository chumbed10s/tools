<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clima</title>
<meta name="theme-color" content="#f4f4f5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="hdr">
    <button id="location-hdr-btn" class="hdr-location">
      <span id="loc-alias">Cargando…</span>
      <span id="loc-real" class="hdr-real"></span>
      <span id="loc-dist" class="hdr-dist"></span>
      <span id="gps-live" class="gps-live" hidden>
        <span class="gps-live-dot"></span>
        <span id="gps-live-time"></span>
      </span>
    </button>
    <div class="hdr-actions">
      <span id="last-updated" class="last-updated"></span>
      <button id="refresh-btn" class="icon-btn" title="Actualizar" aria-label="Actualizar">
        <i class="fa-solid fa-arrows-rotate"></i>
      </button>
      <button id="settings-btn" class="icon-btn" title="Ajustes" aria-label="Ajustes">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <div id="progress-bar" class="progress-bar" hidden><div class="progress-bar-fill"></div></div>

  <main id="view" class="view"></main>

  <nav id="bottomnav" class="bottomnav"></nav>

  <div id="overlay" class="overlay" hidden>
    <div id="overlay-content"></div>
  </div>

  <div id="loading-overlay" class="loading-overlay" hidden><div class="spinner"></div></div>
</div>

<div id="toast-host"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
