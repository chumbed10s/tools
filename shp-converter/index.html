<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMZ / SHP · Visor de capas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080c14;--surface:#0f1623;--card:#141f30;--border:#1f2f45;--border2:#2a3f5a;
  --text:#cee0f5;--muted:#5e7d9c;--dim:#3a5470;--accent:#00c9a7;
  --mono:'JetBrains Mono',monospace;--r:8px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 18px;height:50px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:100}
.hdr-ico{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#00c9a7,#0094a8);display:flex;align-items:center;justify-content:center;font-size:15px}
.hdr-title{font-size:14px;font-weight:700;letter-spacing:-.3px}
.hdr-dot{color:var(--accent)}
.hdr-pill{margin-left:auto;font-size:10px;font-weight:600;font-family:var(--mono);background:rgba(0,201,167,.1);border:1px solid rgba(0,201,167,.25);color:var(--accent);padding:3px 10px;border-radius:20px}
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:272px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.panel{padding:14px 16px;border-bottom:1px solid var(--border)}
.panel:last-child{border-bottom:none}
.plbl{font-size:9.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);font-weight:700;margin-bottom:11px}
.dz{position:relative;border:2px dashed var(--border2);border-radius:var(--r);padding:22px 14px 18px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
.dz:hover,.dz.over{border-color:var(--accent);background:rgba(0,201,167,.04)}
.dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dz-ico{font-size:26px;line-height:1;margin-bottom:8px}
.dz-main{font-size:12px;font-weight:500;margin-bottom:3px}
.dz-hint{font-size:11px;color:var(--muted)}
.dz-fmts{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:10px}
.fmt{font-size:10px;font-weight:700;font-family:var(--mono);padding:2px 6px;border-radius:4px;background:var(--card);border:1px solid var(--border2);color:var(--muted)}
.sbox{padding:8px 11px;border-radius:var(--r);font-size:11.5px;font-weight:500}
.sbox.loading{background:rgba(79,168,232,.1);color:#4fa8e8}
.sbox.success{background:rgba(0,201,167,.1);color:var(--accent)}
.sbox.error{background:rgba(224,92,92,.1);color:#e05c5c}
.sbox.warn{background:rgba(246,185,59,.1);color:#f6b93b}

/* Layer card */
.layer-empty{font-size:12px;color:var(--dim);text-align:center;padding:8px 0}
.lcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 11px;margin-bottom:8px;transition:opacity .2s}
.lcard.hidden{opacity:.4}
.lcard-top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.lswatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.lname{font-size:12px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbtns{display:flex;gap:3px;flex-shrink:0}
.ibtn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px;padding:2px 4px;border-radius:4px;transition:color .15s,background .15s;line-height:1}
.ibtn:hover{color:var(--text);background:var(--border)}
.lmeta{font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-bottom:5px}
.lha{font-size:18px;font-weight:700;color:var(--accent);font-family:var(--mono);letter-spacing:-.5px;line-height:1}
.lha-lbl{font-size:10.5px;font-weight:500;color:var(--muted);margin-bottom:6px}
.field-row{display:flex;align-items:center;gap:6px;margin:6px 0}
.field-lbl{font-size:10px;color:var(--muted);flex-shrink:0}
.field-sel{flex:1;background:var(--bg);border:1px solid var(--border2);color:var(--text);border-radius:5px;padding:3px 6px;font-size:11px;font-family:var(--mono);cursor:pointer;appearance:none;outline:none}
.field-sel:focus{border-color:var(--accent)}

/* Class list (reemplaza al degradado) */
.cls-list{background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:6px 8px;margin-bottom:6px}
.cls-avg{font-size:10px;color:var(--muted);font-family:var(--mono);padding-bottom:5px;margin-bottom:4px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.cls-avg span{color:#ffd43b;font-weight:600}
.cls-row{display:flex;align-items:center;gap:7px;padding:2px 0}
.cls-sq{width:11px;height:11px;border-radius:2px;flex-shrink:0}
.cls-label{font-size:10.5px;font-family:var(--mono);color:var(--text);flex:1}
.cls-cnt{font-size:10px;font-family:var(--mono);color:var(--dim)}

.btn-row{display:flex;gap:5px;margin-top:5px}
.btn-sm{flex:1;padding:6px 8px;border:1px solid var(--border2);background:var(--bg);color:var(--muted);border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s;white-space:nowrap}
.btn-sm:hover{background:rgba(0,201,167,.1);border-color:rgba(0,201,167,.35);color:var(--accent)}
.btn-png{width:100%;padding:9px;background:var(--card);border:1px solid var(--border2);color:var(--muted);border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;margin-top:2px}
.btn-png:hover{background:rgba(79,168,232,.1);border-color:rgba(79,168,232,.4);color:#4fa8e8}

/* Mapa */
#map{flex:1;background:#0a0f1c;position:relative}
.leaflet-popup-content-wrapper{background:var(--card)!important;color:var(--text)!important;border-radius:8px!important;border:1px solid var(--border2)!important;box-shadow:0 8px 32px rgba(0,0,0,.6)!important}
.leaflet-popup-tip{background:var(--card)!important}
.leaflet-popup-close-button{color:var(--muted)!important}
.leaflet-popup-content{margin:11px 13px!important}
.leaflet-control-layers{background:var(--card)!important;border:1px solid var(--border2)!important;border-radius:8px!important;color:var(--text)!important}
.ptbl{font-family:var(--mono);font-size:11px;border-collapse:collapse;min-width:140px;max-width:280px}
.ptbl td{padding:2px 0}
.ptbl .pk{color:var(--muted);padding-right:10px;white-space:nowrap}
.ptbl .pv{color:var(--text)}
.ptbl .pha{color:var(--accent);font-weight:600}
.ptbl .pcls{font-weight:700}

/* Leyenda flotante */
#legend{
  position:absolute;bottom:24px;right:10px;z-index:1000;
  background:rgba(8,12,20,.9);
  border:1px solid var(--border2);
  border-radius:10px;padding:12px 14px;
  min-width:190px;max-width:270px;
  backdrop-filter:blur(10px);
  display:none;pointer-events:none;
}
#legend.visible{display:block}
.leg-title{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:9px}
.leg-layer{margin-bottom:10px}
.leg-layer:last-child{margin-bottom:0}
.leg-lname{font-size:11.5px;font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.leg-lswatch{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.leg-lsub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-bottom:5px;padding-left:16px}
/* clases en la leyenda */
.leg-cls-row{display:flex;align-items:center;gap:6px;padding:1.5px 0;padding-left:16px}
.leg-cls-sq{width:11px;height:11px;border-radius:2px;flex-shrink:0}
.leg-cls-lbl{font-size:10px;font-family:var(--mono);color:var(--text);flex:1}
.leg-avg-lbl{font-size:10px;font-family:var(--mono);color:#ffd43b;padding-left:16px;margin-top:3px}

@media(max-width:640px){
  .layout{flex-direction:column}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:260px;display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;flex-shrink:0}
  .panel{min-width:200px;flex-shrink:0;border-bottom:none;border-right:1px solid var(--border)}
  .panel:last-child{border-right:none}
  #legend{bottom:10px;right:6px}
}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-ico">🗺</div>
  <div class="hdr-title">KMZ / SHP <span class="hdr-dot">·</span> Visor</div>
  <span class="hdr-pill">client-side</span>
</header>
<div class="layout">
<div class="sidebar">
  <div class="panel">
    <div class="plbl">Cargar archivos</div>
    <div class="dz" id="dz">
      <input type="file" id="fi" accept=".kmz,.kml,.shp,.dbf,.zip" multiple>
      <div class="dz-ico">📂</div>
      <div class="dz-main">Arrastrá archivos acá</div>
      <div class="dz-hint">podés tirar múltiples a la vez</div>
      <div class="dz-fmts">
        <span class="fmt">.kmz</span><span class="fmt">.kml</span>
        <span class="fmt">.shp</span><span class="fmt">.zip</span>
      </div>
    </div>
  </div>
  <div class="panel" id="spanel" style="display:none">
    <div class="sbox" id="sbox"></div>
  </div>
  <div class="panel" id="lpanel">
    <div class="plbl">Capas</div>
    <div id="llist"><div class="layer-empty">Cargá un archivo para empezar</div></div>
  </div>
  <div class="panel" id="tools-panel" style="display:none">
    <div class="plbl">Herramientas</div>
    <button class="btn-png" onclick="capturePNG()">📸 Capturar PNG del mapa</button>
  </div>
</div>
<div id="map">
  <div id="legend">
    <div class="leg-title">Leyenda</div>
    <div id="leg-rows"></div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script type="module">
import JSZip from 'https://esm.sh/jszip@3.10.1?bundle';
import { kml as parseKML } from 'https://esm.sh/@tmcw/togeojson@5.8.1?bundle';

// ════════════════════════════════════════════════════════════
//  PALETAS
// ════════════════════════════════════════════════════════════

// Paleta para las capas (una por capa)
const LAYER_PALETTE = [
    '#ff6b6b','#ffd43b','#69db7c','#4dabf7',
    '#ffa94d','#cc5de8','#63e6be','#f783ac',
];

// Paleta para las CLASES dentro de un campo (colores distintos, no degradado)
const CLASS_PALETTE = [
    '#2ecc71', // verde
    '#f1c40f', // amarillo
    '#e67e22', // naranja
    '#e74c3c', // rojo
    '#9b59b6', // violeta
    '#3498db', // azul
    '#1abc9c', // turquesa
    '#e91e63', // rosa
];

const WGS84_PRJ = 'GEOGCS["GCS_WGS_1984",DATUM["D_WGS_1984",SPHEROID["WGS_1984",6378137.0,298.257223563]],PRIMEM["Greenwich",0.0],UNIT["Degree",0.0174532925199433]]';

let layers = [], colorIdx = 0, layerId = 0;

// ════════════════════════════════════════════════════════════
//  HECTÁREAS
// ════════════════════════════════════════════════════════════
function ringAreaM2(ring){
    const lat=ring.reduce((s,c)=>s+c[1],0)/ring.length*Math.PI/180;
    const mLon=111320*Math.cos(lat),mLat=110540;
    let a=0;
    for(let i=0,j=ring.length-1;i<ring.length;j=i++)
        a+=(ring[j][0]*mLon+ring[i][0]*mLon)*(ring[i][1]*mLat-ring[j][1]*mLat);
    return Math.abs(a)/2;
}
function featureHa(f){
    const g=f.geometry;if(!g)return 0;
    const cp=rs=>(ringAreaM2(rs[0])-rs.slice(1).reduce((s,r)=>s+ringAreaM2(r),0))/10000;
    if(g.type==='Polygon')return cp(g.coordinates);
    if(g.type==='MultiPolygon')return g.coordinates.reduce((s,p)=>s+cp(p),0);
    return 0;
}
function totalHa(gj){return gj.features.reduce((s,f)=>s+featureHa(f),0)}
function fmtHa(ha){return ha>=10000?(ha/1000).toFixed(1)+' k':ha>=100?ha.toFixed(0):ha.toFixed(1)}
function fmtNum(n){
    if(typeof n!=='number'||isNaN(n))return '—';
    const s=n>=1000?(n/1000).toFixed(2)+'k':Math.abs(n)<1?n.toFixed(3):n%1===0?n.toFixed(0):n.toFixed(2);
    return s.replace(/\.?0+$/,'');
}

// ════════════════════════════════════════════════════════════
//  CLASIFICACIÓN POR COLORES SÓLIDOS
// ════════════════════════════════════════════════════════════
function numericFields(gj){
    const seen=new Set();
    gj.features.slice(0,50).forEach(f=>{
        Object.entries(f.properties||{}).forEach(([k,v])=>{
            if(typeof v==='number'||(typeof v==='string'&&v!==''&&!isNaN(parseFloat(v))))seen.add(k);
        });
    });
    return[...seen];
}

function buildClasses(gj, field){
    const vals = gj.features.map(f=>parseFloat(f.properties?.[field])).filter(v=>!isNaN(v));
    if(!vals.length) return null;

    const unique = [...new Set(vals.map(v=>Math.round(v*1000)/1000))].sort((a,b)=>a-b);

    // Si hay pocos valores únicos → mapa discreto (ej. prescripción con 30/40/50 kg/ha)
    if(unique.length <= 8){
        const classes = unique.map((v,i)=>({
            label: fmtNum(v),
            color: CLASS_PALETTE[i % CLASS_PALETTE.length],
            test: val => Math.round(val*1000)/1000 === v,
            count: vals.filter(x=>Math.round(x*1000)/1000===v).length,
            ha: gj.features.filter(f=>{
                const fv=parseFloat(f.properties?.[field]);
                return !isNaN(fv)&&Math.round(fv*1000)/1000===v;
            }).reduce((s,f)=>s+featureHa(f),0)
        }));
        return { type:'discrete', classes, avg: weightedAvg(gj,field) };
    }

    // Si hay muchos valores → igual intervalo en 5 clases
    const N=5, min=Math.min(...vals), max=Math.max(...vals), step=(max-min)/N;
    const classes = Array.from({length:N},(_,i)=>{
        const lo=min+i*step, hi=min+(i+1)*step;
        const inClass = vals.filter(v=>i===N-1?v>=lo&&v<=hi:v>=lo&&v<hi);
        const haSum = gj.features.filter(f=>{
            const fv=parseFloat(f.properties?.[field]);
            return !isNaN(fv)&&(i===N-1?fv>=lo&&fv<=hi:fv>=lo&&fv<hi);
        }).reduce((s,f)=>s+featureHa(f),0);
        return{
            label:`${fmtNum(lo)} – ${fmtNum(hi)}`,
            color: CLASS_PALETTE[i % CLASS_PALETTE.length],
            test: val=>i===N-1?(val>=lo&&val<=hi):(val>=lo&&val<hi),
            count: inClass.length,
            ha: haSum,
        };
    });
    return { type:'interval', classes, avg: weightedAvg(gj,field) };
}

function getClassColor(val, clsData){
    if(!clsData) return null;
    const found = clsData.classes.find(c=>c.test(val));
    return found?.color ?? clsData.classes[clsData.classes.length-1].color;
}

function weightedAvg(gj,field){
    let sp=0,sa=0,sc=0;
    gj.features.forEach(f=>{
        const v=parseFloat(f.properties?.[field]);if(isNaN(v))return;
        const ha=featureHa(f);
        if(ha>0){sp+=v*ha;sa+=ha;}else{sp+=v;sc++;}
    });
    if(sa>0)return sp/sa;if(sc>0)return sp/sc;return null;
}

// ════════════════════════════════════════════════════════════
//  MAPA
// ════════════════════════════════════════════════════════════
const osmLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:20,crossOrigin:true});
const satLayer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri/Maxar',maxZoom:20,crossOrigin:true});
const map=L.map('map',{layers:[osmLayer]}).setView([-34,-63],5);
L.control.layers({'🗺 Calles':osmLayer,'🛰 Satélite':satLayer},{},{position:'topright'}).addTo(map);

function geomCls(t=''){
    const s=t.toLowerCase();
    if(s.includes('polygon'))return'poly';
    if(s.includes('line')||s.includes('string'))return'line';
    return'pt';
}

function makeMapLayer(gj, lyr){
    const color=lyr.color;
    return L.geoJSON(gj,{
        style:f=>{
            if(lyr.clsData){
                const val=parseFloat(f.properties?.[lyr.choroField]);
                if(!isNaN(val)){
                    const c=getClassColor(val,lyr.clsData);
                    return{color:'rgba(0,0,0,0.3)',fillColor:c,fillOpacity:.85,weight:.8};
                }
            }
            const cls=geomCls(f.geometry?.type);
            if(cls==='poly')return{color,fillColor:color,fillOpacity:.18,weight:2,opacity:.9};
            if(cls==='line')return{color,weight:3,opacity:.9};
            return{color,weight:2};
        },
        pointToLayer:(f,ll)=>L.circleMarker(ll,{fillColor:lyr.clsData&&lyr.choroField?getClassColor(parseFloat(f.properties?.[lyr.choroField]),lyr.clsData)||color:color,color:'#fff',weight:1.5,radius:6,fillOpacity:.92}),
        onEachFeature:(f,layer)=>{
            const ha=featureHa(f);const rows=[];
            if(ha>0)rows.push(`<tr><td class="pk">área</td><td class="pv pha">${fmtHa(ha)} ha</td></tr>`);
            if(lyr.choroField){
                const val=f.properties?.[lyr.choroField];
                if(val!==undefined&&val!==null&&val!==''){
                    const c=getClassColor(parseFloat(val),lyr.clsData);
                    const dot=c?`<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${c};margin-right:4px;vertical-align:middle"></span>`:'';
                    rows.push(`<tr><td class="pk">${lyr.choroField}</td><td class="pv pcls">${dot}${parseFloat(val).toFixed(2)}</td></tr>`);
                }
            }
            Object.entries(f.properties||{})
                .filter(([k,v])=>k!==lyr.choroField&&v!==null&&v!==undefined&&v!=='')
                .slice(0,15)
                .forEach(([k,v])=>rows.push(`<tr><td class="pk">${k}</td><td class="pv">${String(v).slice(0,100)}</td></tr>`));
            if(rows.length)layer.bindPopup(`<table class="ptbl">${rows.join('')}</table>`,{maxWidth:300});
        }
    });
}

// ════════════════════════════════════════════════════════════
//  GESTIÓN DE CAPAS
// ════════════════════════════════════════════════════════════
function addLayer(name,gj){
    const color=LAYER_PALETTE[colorIdx++%LAYER_PALETTE.length];
    const id=layerId++;
    const ha=totalHa(gj),nFeat=gj.features.length;
    const types=[...new Set(gj.features.map(f=>f.geometry?.type).filter(Boolean))];
    const numFields=numericFields(gj);
    const lyr={id,name,gj,color,ha,nFeat,types,numFields,visible:true,choroField:null,clsData:null,mapLyr:null};
    lyr.mapLyr=makeMapLayer(gj,lyr).addTo(map);
    layers.push(lyr);
    try{map.fitBounds(lyr.mapLyr.getBounds(),{padding:[40,40]})}catch(_){}
    renderAll();return lyr;
}

window.removeLayer=function(id){
    const i=layers.findIndex(l=>l.id===id);if(i===-1)return;
    map.removeLayer(layers[i].mapLyr);layers.splice(i,1);renderAll();
};
window.toggleLayer=function(id){
    const lyr=layers.find(l=>l.id===id);if(!lyr)return;
    lyr.visible=!lyr.visible;
    if(lyr.visible)lyr.mapLyr.addTo(map);else map.removeLayer(lyr.mapLyr);
    renderAll();
};
window.setField=function(id,field){
    const lyr=layers.find(l=>l.id===id);if(!lyr)return;
    lyr.choroField=field||null;
    lyr.clsData=field?buildClasses(lyr.gj,field):null;
    map.removeLayer(lyr.mapLyr);
    lyr.mapLyr=makeMapLayer(lyr.gj,lyr).addTo(map);
    renderAll();
};
window.downloadLayer=async function(id){
    const lyr=layers.find(l=>l.id===id);if(!lyr)return;
    setStatus('loading','⏳ Generando SHP…');
    try{const blob=await exportAsZip(lyr.gj);dl(lyr.name+'.zip',blob);setStatus('success','✓ Descargado: '+lyr.name+'.zip');}
    catch(err){setStatus('error','✕ '+err.message);}
};
window.fitLayer=function(id){
    const lyr=layers.find(l=>l.id===id);if(!lyr)return;
    try{map.fitBounds(lyr.mapLyr.getBounds(),{padding:[40,40]})}catch(_){}
};

// ════════════════════════════════════════════════════════════
//  RENDER UI
// ════════════════════════════════════════════════════════════
function renderAll(){
    renderLayers();renderLegend();
    document.getElementById('tools-panel').style.display=layers.length?'block':'none';
}

function renderLayers(){
    const el=document.getElementById('llist');
    if(!layers.length){el.innerHTML='<div class="layer-empty">Sin capas cargadas</div>';return;}
    el.innerHTML=layers.map(lyr=>{
        const haStr=lyr.ha>0?`<div class="lha">${fmtHa(lyr.ha)}</div><div class="lha-lbl">ha totales</div>`:'';
        const typeStr=[...new Set(lyr.types.map(t=>geomCls(t)==='poly'?'Polígonos':geomCls(t)==='line'?'Líneas':'Puntos'))].join(' + ');

        let fieldHtml='';
        if(lyr.numFields.length>0){
            const opts=['<option value="">— sin campo —</option>',
                ...lyr.numFields.map(f=>`<option value="${f}"${f===lyr.choroField?'selected':''}>${f}</option>`)
            ].join('');
            fieldHtml=`<div class="field-row">
              <span class="field-lbl">Campo:</span>
              <select class="field-sel" onchange="setField(${lyr.id},this.value)">${opts}</select>
            </div>`;
        }

        // Lista de clases con cuadrado de color sólido
        let clsHtml='';
        if(lyr.clsData){
            const avg=lyr.clsData.avg!==null?fmtNum(lyr.clsData.avg):'—';
            const hasHa=lyr.ha>0;
            const rows=lyr.clsData.classes.map(c=>{
                const cnt=hasHa&&c.ha>0
                    ?`<span class="cls-cnt">${fmtHa(c.ha)} ha</span>`
                    :`<span class="cls-cnt">${c.count}</span>`;
                return`<div class="cls-row">
                  <div class="cls-sq" style="background:${c.color}"></div>
                  <div class="cls-label">${c.label}</div>
                  ${cnt}
                </div>`;
            }).join('');
            clsHtml=`<div class="cls-list">
              <div class="cls-avg">Prom. pond. <span>${avg} ${lyr.choroField}</span></div>
              ${rows}
            </div>`;
        }

        return`<div class="lcard${lyr.visible?'':' hidden'}" id="lc-${lyr.id}">
          <div class="lcard-top">
            <div class="lswatch" style="background:${lyr.color}"></div>
            <div class="lname" title="${lyr.name}">${lyr.name}</div>
            <div class="lbtns">
              <button class="ibtn" title="${lyr.visible?'Ocultar':'Mostrar'}" onclick="toggleLayer(${lyr.id})">${lyr.visible?'👁':'◻'}</button>
              <button class="ibtn" title="Eliminar" onclick="removeLayer(${lyr.id})">✕</button>
            </div>
          </div>
          <div class="lmeta">${typeStr} · ${lyr.nFeat} features</div>
          ${haStr}${fieldHtml}${clsHtml}
          <div class="btn-row">
            <button class="btn-sm" onclick="downloadLayer(${lyr.id})">⬇ SHP</button>
            <button class="btn-sm" onclick="fitLayer(${lyr.id})">⊙ Centrar</button>
          </div>
        </div>`;
    }).join('');
}

function renderLegend(){
    const leg=document.getElementById('legend'),rows=document.getElementById('leg-rows');
    if(!layers.length){leg.classList.remove('visible');return;}
    leg.classList.add('visible');
    rows.innerHTML=layers.filter(l=>l.visible).map(lyr=>{
        let detail='';
        if(lyr.ha>0) detail+=`<div class="leg-lsub">${fmtHa(lyr.ha)} ha · ${lyr.nFeat} features</div>`;
        else detail+=`<div class="leg-lsub">${lyr.nFeat} features</div>`;

        if(lyr.clsData){
            // Cuadrados de color por clase (sin degradado)
            detail+=lyr.clsData.classes.map(c=>`
              <div class="leg-cls-row">
                <div class="leg-cls-sq" style="background:${c.color}"></div>
                <div class="leg-cls-lbl">${c.label}</div>
              </div>`).join('');
            if(lyr.clsData.avg!==null)
                detail+=`<div class="leg-avg-lbl">Ø ${fmtNum(lyr.clsData.avg)} ${lyr.choroField}</div>`;
        }

        return`<div class="leg-layer">
          <div class="leg-lname">
            <div class="leg-lswatch" style="background:${lyr.color}"></div>
            ${lyr.name}
          </div>
          ${detail}
        </div>`;
    }).join('');
}

window.capturePNG=async function(){
    setStatus('loading','⏳ Capturando…');
    try{
        const canvas=await html2canvas(document.querySelector('.layout'),{
            useCORS:true,scale:Math.min(window.devicePixelRatio||2,2),

    }catch(err){setStatus('error','✕ '+err.message);}
};

// ════════════════════════════════════════════════════════════
//  SHP READER
// ════════════════════════════════════════════════════════════
function rSign(ring){let a=0;for(let i=0,j=ring.length-1;i<ring.length;j=i++)a+=(ring[j][0]+ring[i][0])*(ring[i][1]-ring[j][1]);return a/2;}
function p2g(parts,st){
    if(!parts.length)return null;
    if(st===3)return parts.length===1?{type:'LineString',coordinates:parts[0]}:{type:'MultiLineString',coordinates:parts};
    if(parts.length===1)return{type:'Polygon',coordinates:parts};
    const areas=parts.map(r=>rSign(r));const polys=[];let cur=null;
    parts.forEach((ring,i)=>{if(areas[i]>=0||cur===null){cur=[ring];polys.push(cur);}else cur.push(ring);});
    return polys.length===1?{type:'Polygon',coordinates:polys[0]}:{type:'MultiPolygon',coordinates:polys};
}
function readSHP(buf){
    const v=new DataView(buf);const feats=[];let off=100;
    while(off+8<=buf.byteLength){
        const cl=v.getInt32(off+4,false)*2;off+=8;
        if(off+cl>buf.byteLength)break;
        const rt=v.getInt32(off,true);
        if(rt===0){off+=cl;continue;}
        if(rt===1){feats.push({type:'Feature',geometry:{type:'Point',coordinates:[v.getFloat64(off+4,true),v.getFloat64(off+12,true)]},properties:{}});}
        else if(rt===3||rt===5){
            const np=v.getInt32(off+36,true),npt=v.getInt32(off+40,true);
            const parts=[];for(let i=0;i<np;i++)parts.push(v.getInt32(off+44+i*4,true));
            const pb=off+44+np*4;const pts=[];
            for(let i=0;i<npt;i++)pts.push([v.getFloat64(pb+i*16,true),v.getFloat64(pb+i*16+8,true)]);
            feats.push({type:'Feature',geometry:p2g(parts.map((s,i)=>pts.slice(s,parts[i+1]??npt)),rt),properties:{}});
        }
        off+=cl;
    }
    return feats;
}
function readDBF(buf){
    const v=new DataView(buf),dec=new TextDecoder('latin1');
    const nr=v.getInt32(4,true),hs=v.getInt16(8,true),rs=v.getInt16(10,true);
    const fields=[];let off=32;
    while(off<hs-1&&v.getUint8(off)!==0x0D){
        fields.push({name:dec.decode(new Uint8Array(buf,off,11)).replace(/\0.*$/,''),type:String.fromCharCode(v.getUint8(off+11)),len:v.getUint8(off+16)});
        off+=32;
    }
    const recs=[];let ro=hs;
    for(let i=0;i<nr;i++){
        const del=v.getUint8(ro);ro++;const rec={};
        fields.forEach(f=>{const raw=dec.decode(new Uint8Array(buf,ro,f.len)).trim();rec[f.name]=(f.type==='N'||f.type==='F')?(parseFloat(raw)||0):raw;ro+=f.len;});
        if(del!==0x2A)recs.push(rec);
    }
    return recs;
}

// ════════════════════════════════════════════════════════════
//  SHP WRITER
// ════════════════════════════════════════════════════════════
function wH(buf,st,bl,bb){const v=new DataView(buf);v.setInt32(0,9994,false);v.setInt32(24,bl/2,false);v.setInt32(28,1000,true);v.setInt32(32,st,true);[bb.xmin,bb.ymin,bb.xmax,bb.ymax,0,0,0,0].forEach((n,i)=>v.setFloat64(36+i*8,n,true));}
function eXY(g,fn){if(!g)return;switch(g.type){case'Point':fn(g.coordinates[0],g.coordinates[1]);break;case'MultiPoint':case'LineString':g.coordinates.forEach(c=>fn(c[0],c[1]));break;case'MultiLineString':case'Polygon':g.coordinates.forEach(r=>r.forEach(c=>fn(c[0],c[1])));break;case'MultiPolygon':g.coordinates.forEach(p=>p.forEach(r=>r.forEach(c=>fn(c[0],c[1]))));break;}}
function bbF(fs){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;fs.forEach(f=>eXY(f.geometry,(x,y)=>{if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y}));return{xmin:a,ymin:b,xmax:c,ymax:d};}
function bPt(fs){const pts=[];fs.forEach(f=>{const g=f.geometry;if(g.type==='Point')pts.push({c:g.coordinates,p:f.properties});else if(g.type==='MultiPoint')g.coordinates.forEach(c=>pts.push({c,p:f.properties}))});const C=20,R=28,fl=100+pts.length*R,bb=bbF(fs);const sb=new ArrayBuffer(fl);wH(sb,1,fl,bb);const sv=new DataView(sb);const xb=new ArrayBuffer(100+pts.length*8);wH(xb,1,100+pts.length*8,bb);const xv=new DataView(xb);let so=100,xo=100;pts.forEach((pt,i)=>{xv.setInt32(xo,so/2,false);xv.setInt32(xo+4,C/2,false);xo+=8;sv.setInt32(so,i+1,false);sv.setInt32(so+4,C/2,false);so+=8;sv.setInt32(so,1,true);sv.setFloat64(so+4,pt.c[0],true);sv.setFloat64(so+12,pt.c[1],true);so+=C;});return{shp:new Uint8Array(sb),shx:new Uint8Array(xb),recs:pts.map(p=>({props:p.p}))};}
function bLin(fs,st){const recs=[];fs.forEach(f=>{const g=f.geometry,p=f.properties;if(g.type==='LineString')recs.push({parts:[g.coordinates],props:p});else if(g.type==='MultiLineString')recs.push({parts:g.coordinates,props:p});else if(g.type==='Polygon')recs.push({parts:g.coordinates,props:p});else if(g.type==='MultiPolygon')g.coordinates.forEach(rings=>recs.push({parts:rings,props:p}))});const sz=recs.map(r=>{const np=r.parts.length,npt=r.parts.reduce((s,p)=>s+p.length,0);return{np,npt,cb:44+4*np+16*npt}});const tc=sz.reduce((s,z)=>s+z.cb,0),fl=100+recs.length*8+tc,bb=bbF(fs);const sb=new ArrayBuffer(fl);wH(sb,st,fl,bb);const sv=new DataView(sb);const xb=new ArrayBuffer(100+recs.length*8);wH(xb,st,100+recs.length*8,bb);const xv=new DataView(xb);let so=100,xo=100;recs.forEach((rec,i)=>{const{np,npt,cb}=sz[i];xv.setInt32(xo,so/2,false);xv.setInt32(xo+4,cb/2,false);xo+=8;sv.setInt32(so,i+1,false);sv.setInt32(so+4,cb/2,false);so+=8;sv.setInt32(so,st,true);let rx=Infinity,ry=Infinity,rX=-Infinity,rY=-Infinity;rec.parts.forEach(pt=>pt.forEach(([x,y])=>{if(x<rx)rx=x;if(y<ry)ry=y;if(x>rX)rX=x;if(y>rY)rY=y}));sv.setFloat64(so+4,rx,true);sv.setFloat64(so+12,ry,true);sv.setFloat64(so+20,rX,true);sv.setFloat64(so+28,rY,true);sv.setInt32(so+36,np,true);sv.setInt32(so+40,npt,true);let ps=0;rec.parts.forEach((pt,pi)=>{sv.setInt32(so+44+pi*4,ps,true);ps+=pt.length});let po=so+44+np*4;rec.parts.forEach(pt=>pt.forEach(c=>{sv.setFloat64(po,c[0],true);sv.setFloat64(po+8,c[1],true);po+=16}));so+=cb;});return{shp:new Uint8Array(sb),shx:new Uint8Array(xb),recs:recs.map(r=>({props:r.props}))};}
function bDBF(recs){const enc=new TextEncoder(),fm=new Map();recs.forEach(r=>Object.keys(r.props||{}).forEach(k=>{const key=k.slice(0,10);if(!fm.has(key))fm.set(key,5)}));recs.forEach(r=>(Object.entries(r.props||{})).forEach(([k,v])=>{const key=k.slice(0,10);if(!fm.has(key))return;const s=v===null||v===undefined?'':(typeof v==='object'?JSON.stringify(v):String(v));fm.set(key,Math.min(254,Math.max(fm.get(key),s.length)))}));const fields=[...fm.entries()];const hs=32+fields.length*32+1,rs=1+fields.reduce((s,[,l])=>s+l,0);const buf=new ArrayBuffer(hs+recs.length*rs);const v=new DataView(buf),b=new Uint8Array(buf);const now=new Date();v.setUint8(0,3);v.setUint8(1,now.getFullYear()-1900);v.setUint8(2,now.getMonth()+1);v.setUint8(3,now.getDate());v.setInt32(4,recs.length,true);v.setInt16(8,hs,true);v.setInt16(10,rs,true);fields.forEach(([n,l],i)=>{const base=32+i*32;b.set(enc.encode(n),base);v.setUint8(base+11,0x43);v.setUint8(base+16,l)});v.setUint8(32+fields.length*32,0x0D);let off=hs;recs.forEach(r=>{b[off]=0x20;off++;fields.forEach(([n,l])=>{const raw=(r.props||{})[n];let val=raw===null||raw===undefined?'':(typeof raw==='object'?JSON.stringify(raw):String(raw));val=val.slice(0,l);const vb=enc.encode(val);b.set(vb,off);for(let k=vb.length;k<l;k++)b[off+k]=0x20;off+=l})});return b;}
async function exportAsZip(gj){const zip=new JSZip();const pf=gj.features.filter(f=>['Point','MultiPoint'].includes(f.geometry?.type));const lf=gj.features.filter(f=>['LineString','MultiLineString'].includes(f.geometry?.type));const pof=gj.features.filter(f=>['Polygon','MultiPolygon'].includes(f.geometry?.type));if(pf.length){const{shp,shx,recs}=bPt(pf);zip.file('puntos.shp',shp);zip.file('puntos.shx',shx);zip.file('puntos.dbf',bDBF(recs));zip.file('puntos.prj',WGS84_PRJ)}if(lf.length){const{shp,shx,recs}=bLin(lf,3);zip.file('lineas.shp',shp);zip.file('lineas.shx',shx);zip.file('lineas.dbf',bDBF(recs));zip.file('lineas.prj',WGS84_PRJ)}if(pof.length){const{shp,shx,recs}=bLin(pof,5);zip.file('poligonos.shp',shp);zip.file('poligonos.shx',shx);zip.file('poligonos.dbf',bDBF(recs));zip.file('poligonos.prj',WGS84_PRJ)}return zip.generateAsync({type:'blob',compression:'DEFLATE'});}

// ════════════════════════════════════════════════════════════
//  CARGA DE ARCHIVOS
// ════════════════════════════════════════════════════════════
async function processFiles(files){
    const arr=Array.from(files),byBase={};
    arr.forEach(f=>{const parts=f.name.split('.');const ext=parts.pop().toLowerCase();const base=parts.join('.').toLowerCase();if(!byBase[base])byBase[base]={};byBase[base][ext]=f;});
    for(const[,exts]of Object.entries(byBase)){
        try{
            if(exts.kmz)await loadKMZ(exts.kmz);
            else if(exts.kml)await loadKML(exts.kml);
            else if(exts.shp){const sb=await exts.shp.arrayBuffer();const db=exts.dbf?await exts.dbf.arrayBuffer():null;await loadSHP(exts.shp.name.replace(/\.shp$/i,''),sb,db);}
            else if(exts.zip)await loadZIP(exts.zip);
        }catch(err){setStatus('error','✕ '+err.message);}
    }
}
async function loadKMZ(file){setStatus('loading','⏳ '+file.name+'…');const zip=await JSZip.loadAsync(file);const kmls=Object.keys(zip.files).filter(n=>n.toLowerCase().endsWith('.kml')&&!zip.files[n].dir);if(!kmls.length)throw new Error('No hay KML dentro del KMZ');const all=[];for(const n of kmls){const str=await zip.files[n].async('string');const gj=parseKML(new DOMParser().parseFromString(str,'text/xml'));if(gj?.features)all.push(...gj.features);}const gj={type:'FeatureCollection',features:all.filter(f=>f.geometry?.type)};if(!gj.features.length)throw new Error('Sin geometrías en '+file.name);const lyr=addLayer(file.name.replace(/\.kmz$/i,''),gj);setStatus('success',`✓ ${lyr.name} · ${lyr.nFeat} feat${lyr.ha>0?' · '+fmtHa(lyr.ha)+' ha':''}`);}
async function loadKML(file){setStatus('loading','⏳ '+file.name+'…');const str=await file.text();const gj=parseKML(new DOMParser().parseFromString(str,'text/xml'));gj.features=(gj.features||[]).filter(f=>f.geometry?.type);if(!gj.features.length)throw new Error('Sin geometrías en '+file.name);const lyr=addLayer(file.name.replace(/\.kml$/i,''),gj);setStatus('success',`✓ ${lyr.name} · ${lyr.nFeat} feat${lyr.ha>0?' · '+fmtHa(lyr.ha)+' ha':''}`);}
async function loadSHP(name,shpBuf,dbfBuf){setStatus('loading','⏳ '+name+'…');const feats=readSHP(shpBuf);const recs=dbfBuf?readDBF(dbfBuf):feats.map(()=>({}));feats.forEach((f,i)=>{f.properties=recs[i]||{}});const gj={type:'FeatureCollection',features:feats.filter(f=>f.geometry?.type)};if(!gj.features.length)throw new Error('Sin geometrías en '+name+'.shp');const lyr=addLayer(name,gj);setStatus('success',`✓ ${lyr.name} · ${lyr.nFeat} feat${lyr.ha>0?' · '+fmtHa(lyr.ha)+' ha':''}${dbfBuf?'':' (sin atributos)'}`);}
async function loadZIP(file){setStatus('loading','⏳ Analizando ZIP…');const zip=await JSZip.loadAsync(file);const shpNames=Object.keys(zip.files).filter(n=>n.toLowerCase().endsWith('.shp')&&!zip.files[n].dir);if(!shpNames.length)throw new Error('No hay SHP dentro del ZIP');for(const sn of shpNames){const base=sn.replace(/\.shp$/i,'');const dk=Object.keys(zip.files).find(n=>n.toLowerCase()===base.toLowerCase()+'.dbf');const sb=await zip.files[sn].async('arraybuffer');const db=dk?await zip.files[dk].async('arraybuffer'):null;await loadSHP(sn.split('/').pop().replace(/\.shp$/i,''),sb,db);}}

function setStatus(type,msg){const b=document.getElementById('sbox'),p=document.getElementById('spanel');b.className='sbox '+type;b.textContent=msg;p.style.display='block';}
function dl(filename,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);}

const dz=document.getElementById('dz'),fi=document.getElementById('fi');
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>processFiles(e.dataTransfer.files));
fi.addEventListener('change',e=>{if(e.target.files.length)processFiles(e.target.files)});
renderAll();
</script>
