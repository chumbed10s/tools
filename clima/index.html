<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clima · Campo</title>
<meta name="theme-color" content="#e8e4db">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="backdrop" aria-hidden="true"></canvas>

<div id="app">
  <header class="hdr">
    <button id="location-btn" class="hdr-location">
      <span id="location-name">Cargando…</span>
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
    </button>
    <span id="gps-pill" class="gps-pill" hidden><i></i>GPS</span>
    <div class="hdr-actions">
      <button id="refresh-btn" class="icon-btn" title="Actualizar" aria-label="Actualizar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-.5 4M20 5v6h-6"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav id="bottomnav" class="bottomnav"></nav>

  <div class="modal-overlay" id="location-modal" hidden>
    <div class="modal-card location-modal">
      <div class="modal-top">
        <span class="modal-title">Ubicaciones</span>
        <button class="modal-close" id="location-close" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <button class="gps-btn" id="gps-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>
          Usar mi ubicación
        </button>
        <input class="search-input" id="location-search" placeholder="Buscar ciudad…" autocomplete="off">
        <div id="search-results" class="search-results"></div>
        <div class="saved-label">Guardadas</div>
        <div id="saved-list" class="saved-list"></div>
      </div>
    </div>
  </div>

  <div id="loading-overlay" class="loading-overlay" hidden><div class="spinner"></div></div>
</div>

<div id="toast-host"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
