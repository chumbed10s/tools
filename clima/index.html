<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>
// Si el usuario ya eligió pasarse a la versión nueva, redirigir siempre desde acá.
try{
  if(localStorage.getItem('clima_redirect_to_21')==='1')location.replace('../clima-2-1/');
}catch(e){}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clima · Campo</title>
<meta name="theme-color" content="#e8e4db">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="new-version-banner" hidden style="position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#111827;color:#f4f4f5;font:13px/1.4 -apple-system,'Segoe UI',Roboto,sans-serif;border-bottom:1px solid #2e2e33;">
  <span>Hay una nueva versión de Clima disponible.</span>
  <button id="nvb-go" style="background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-weight:600;font-size:12.5px;cursor:pointer;">Ir a la nueva versión</button>
  <button id="nvb-dismiss" aria-label="Cerrar" style="background:none;border:none;color:#9d9da8;font-size:16px;cursor:pointer;line-height:1;padding:2px 6px;">&times;</button>
</div>
<canvas id="backdrop" aria-hidden="true"></canvas>

<div id="app">
  <header class="hdr">
    <button id="location-btn" class="hdr-location">
      <span id="location-name">Cargando…</span>
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
    </button>
    <span id="gps-pill" class="gps-pill" hidden><i></i>GPS</span>
    <div class="hdr-actions">
      <button id="refresh-btn" class="icon-btn" title="Actualizar" aria-label="Actualizar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-.5 4M20 5v6h-6"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav id="bottomnav" class="bottomnav"></nav>

  <div class="modal-overlay" id="location-modal" hidden>
    <div class="modal-card location-modal">
      <div class="modal-top">
        <span class="modal-title">Ubicaciones</span>
        <button class="modal-close" id="location-close" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <button class="gps-btn" id="gps-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>
          Usar mi ubicación
        </button>
        <input class="search-input" id="location-search" placeholder="Buscar ciudad…" autocomplete="off">
        <div id="search-results" class="search-results"></div>
        <div class="saved-label">Guardadas</div>
        <div id="saved-list" class="saved-list"></div>
      </div>
    </div>
  </div>

  <div id="loading-overlay" class="loading-overlay" hidden><div class="spinner"></div></div>
</div>

<div id="toast-host"></div>
<script type="module" src="js/main.js"></script>
<script>
(function(){
  var REDIRECT_KEY='clima_redirect_to_21', DISMISS_KEY='clima_21_banner_dismissed';
  var banner=document.getElementById('new-version-banner');
  if(!banner)return;
  if(!sessionStorage.getItem(DISMISS_KEY)){
    banner.hidden=false;
    document.body.style.paddingTop='44px';
  }
  document.getElementById('nvb-go').addEventListener('click',function(){
    try{localStorage.setItem(REDIRECT_KEY,'1');}catch(e){}
    location.href='../clima-2-1/';
  });
  document.getElementById('nvb-dismiss').addEventListener('click',function(){
    banner.hidden=true;
    document.body.style.paddingTop='';
    try{sessionStorage.setItem(DISMISS_KEY,'1');}catch(e){}
  });
})();
</script>
</body>
</html>
